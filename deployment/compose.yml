name: bothesis

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bothesis}
      POSTGRES_USER: ${POSTGRES_USER:-bothesis}
      # Local development default. Override it in deployment/.env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bothesis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 3 bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bothesis}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-bothesis}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    restart: unless-stopped

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_TOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    stdin_open: true
    tty: true

  temporal-init:
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_TOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until temporal operator cluster health >/dev/null 2>&1; do sleep 1; done
        until temporal operator namespace describe \
          --namespace "$$TEMPORAL_NAMESPACE" >/dev/null 2>&1; do sleep 1; done
        until temporal operator search-attribute list \
          --namespace "$$TEMPORAL_NAMESPACE" >/dev/null 2>&1; do sleep 1; done
        for attribute in TenantId IngestionSourceId IntegrationConnectionId ConnectorKey WorkflowCategory TriggerType; do
          output="$$(temporal operator search-attribute create \
            --namespace "$$TEMPORAL_NAMESPACE" \
            --name "$$attribute" \
            --type Keyword 2>&1)" || {
              echo "$$output" | grep -qi "already exists" || {
                echo "$$output" >&2
                exit 1
              }
            }
        done

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bothesis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bothesis}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bothesis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bothesis}
      MINIO_BUCKET: ${MINIO_BUCKET:-bothesis}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

volumes:
  postgres_data:
  qdrant_storage:
  minio_data:
