<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoThesis audit comparisons</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111827; color: #f8fafc; font: 14px system-ui, sans-serif; }
      main { display: grid; gap: 32px; padding: 32px; }
      section { display: grid; gap: 12px; }
      h2 { margin: 0; font-size: 16px; }
      .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
      figure { margin: 0; display: grid; gap: 8px; }
      figcaption { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      img { display: block; width: 100%; height: auto; border: 1px solid #334155; background: white; }
    </style>
  </head>
  <body>
    <main>
      <section><h2>Chat · desktop</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="../before/01-chat-desktop.png" /></figure><figure><figcaption>After</figcaption><img src="../after/01-chat-desktop.png" /></figure></div></section>
      <section><h2>Chat · mobile</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="../before/02-chat-mobile.png" /></figure><figure><figcaption>After</figcaption><img src="../after/02-chat-mobile.png" /></figure></div></section>
      <section><h2>Sign-in · desktop</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="../before/03-login-desktop.png" /></figure><figure><figcaption>After</figcaption><img src="../after/03-login-desktop.png" /></figure></div></section>
      <section><h2>Admin · desktop</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="../before/04-admin-desktop.png" /></figure><figure><figcaption>After</figcaption><img src="../after/04-admin-desktop.png" /></figure></div></section>
      <section><h2>Admin · mobile</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="../before/05-admin-mobile.png" /></figure><figure><figcaption>After</figcaption><img src="../after/05-admin-mobile.png" /></figure></div></section>
      <section><h2>Workflows · desktop</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="../before/06-workflows-desktop.png" /></figure><figure><figcaption>After</figcaption><img src="../after/06-workflows-desktop.png" /></figure></div></section>
    </main>
  </body>
</html>
